[package]
name = "sentinelforge"
version = "0.1.0"
edition = "2024"
authors = ["lloredia"]
description = "SentinelForge - Collect, enrich, and correlate IOCs"
license = "MIT"
repository = "https://github.com/lloredia/sentinelforge"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
base64 = "0.22"

# Web framework
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "timeout"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "migrate"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utils
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive", "env"] }
dotenvy = "0.15"
url = "2.5"
maxminddb = "0.27"
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
sha2 = "0.10"
subtle = "2.6"

# Rate limiting
governor = "0.6"